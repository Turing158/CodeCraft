[package]
name = "codecraft-cursor-probe"
version = "0.1.0"
edition = "2021"
publish = false

# P0 remains independent of the desktop binary and cannot enable integration.
[dependencies]
codecraft-cursor = { path = "../../src-tauri/cursor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_Authorization"] }
