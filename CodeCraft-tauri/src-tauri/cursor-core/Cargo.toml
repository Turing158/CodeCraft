[package]
name = "codecraft-cursor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_UI_Shell"] }
