[package]
name = "codecraft-tauri"
version = "0.1.1"
description = "A compact, always-on-top desktop toolbar"
authors = ["CodeCraft"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codecraft_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.10"
url = "2.5.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis", "wav", "mp3", "flac"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell"] }
